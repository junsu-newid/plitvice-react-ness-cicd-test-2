name: Deploy

on:
  pull_request:
    types: [closed]
    branches:
      - stage

# on:
#   push:
#     branches:
#       - stage

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: stage

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.5.2

      - name: Install dependencies
        run: pnpm install

      - name: Build web projects
        run: pnpm -r build

      - name: Prepare deployment package
        run: |
          # Create deployment directory structure
          mkdir -p plitvice/web
          mkdir -p plitvice/shared/ui
          mkdir -p plitvice/shared/util
          
          # Copy web projects with build and package.json
          for project in web/*; do
            if [ -d "$project" ] && [ -f "$project/package.json" ]; then
              name=$(basename $project)
              echo "Preparing $name..."
              mkdir -p "plitvice/web/$name"
              cp -r "$project/build" "plitvice/web/$name/"
              cp "$project/package.json" "plitvice/web/$name/"
            fi
          done
          
          # Copy shared projects with dist and package.json (excluding template)
          for project in shared/*; do
            if [ -d "$project" ] && [ -f "$project/package.json" ]; then
              name=$(basename $project)
              # Skip template project
              if [ "$name" = "template" ]; then
                echo "Skipping template project"
                continue
              fi
              echo "Preparing shared project: $name"
              mkdir -p "plitvice/shared/$name"
              # Copy dist directory (build output) if it exists
              if [ -d "$project/dist" ]; then
                cp -r "$project/dist" "plitvice/shared/$name/"
              fi
              # Copy build directory (if it exists for some projects)
              if [ -d "$project/build" ]; then
                cp -r "$project/build" "plitvice/shared/$name/"
              fi
              cp "$project/package.json" "plitvice/shared/$name/"
            fi
          done
          
          # Copy root files
          cp ecosystem.config.cjs plitvice/ || true
          cp package.json plitvice/
          cp pnpm-lock.yaml plitvice/
          cp pnpm-workspace.yaml plitvice/
          
          echo "Deployment package structure:"
          find plitvice -type f | sort

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: plitvice-deployment
          path: plitvice/
          retention-days: 7

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      
      - name: Shut down servers
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} << 'EOF'
            cd ${{ secrets.REMOTE_SCRIPT_PATH }}
            ./shutdown.sh
            echo "Servers shut down successfully"
          EOF
          
      - name: Deploy to EC2
        run: |
          # Copy entire deployment package
          echo "Deploying plitvice package..."
          scp -o StrictHostKeyChecking=no -r plitvice/* ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}:${{ secrets.REMOTE_BUILD_PATH }}/
      
      - name: Restart servers via SSH
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} << 'EOF'
            cd ${{ secrets.REMOTE_SCRIPT_PATH }}
            ./reboot.sh
            echo "Servers rebooted successfully"
          EOF
      